name: zig
# The Zig build: its unit tests, and the command-line suite of the Bash
# script run against the -Dtest-ops test artifact, on both architectures.
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  zig:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.1
      - run: zig fmt --check src build.zig
      - run: zig build unit --summary all
      - run: zig build -Dtest-ops=true test --summary all
      - name: a release build carries no test seam
        run: |
          zig build --release=safe --prefix out
          ! grep -aq EB_LOCAL_TEST_MOUNTINFO out/bin/eb-local
          ! grep -aq EB_LOCAL_TEST_UID out/bin/eb-local
          out/bin/eb-local --version
